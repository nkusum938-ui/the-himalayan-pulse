<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#065F46"/>
    </linearGradient>
    <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  
  <!-- Subtle inner border -->
  <rect x="12" y="12" width="488" height="488" rx="88" fill="none" stroke="#34D399" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Background mountain peaks -->
  <polygon points="80,390 190,210 290,340 432,390" fill="#1E293B" opacity="0.75"/>

  <!-- Main Himalayan Mountain Peak -->
  <polygon points="120,390 256,140 392,390" fill="url(#mountainGrad)"/>

  <!-- Mountain Snow Cap -->
  <polygon points="256,140 286,192 268,198 256,182 244,198 226,192" fill="#FFFFFF"/>

  <!-- Heartbeat Pulse Line (Outer Glow & Stroke) -->
  <path d="M 64 340 L 160 340 L 188 295 L 216 385 L 256 210 L 296 410 L 328 320 L 352 340 L 448 340" 
        fill="none" 
        stroke="#10B981" 
        stroke-width="26" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Heartbeat Pulse Line (Inner White Core) -->
  <path d="M 64 340 L 160 340 L 188 295 L 216 385 L 256 210 L 296 410 L 328 320 L 352 340 L 448 340" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="10" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
</svg>
